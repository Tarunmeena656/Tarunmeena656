# Rewrites the "Latest videos" list in README.md from the channel's playlist feeds.
name: Latest videos

on:
  schedule:
    - cron: "30 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/videos.yml"]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gautamkrishnar/blog-post-workflow@v1
        with:
          # the coding playlists; swap for channel_id=UCE7f-OWz1zyPJ3_PjPhHKqg to show every upload including shorts
          feed_list: "https://www.youtube.com/feeds/videos.xml?playlist_id=PL_eNksFWsdqEty1KnVARdrdnFS58fKFqY,https://www.youtube.com/feeds/videos.xml?playlist_id=PL_eNksFWsdqEbrt4s8oAA5DUQUM5dSWZG"
          title_max_length: 70
          max_post_count: 3
          comment_tag_name: "YOUTUBE-LIST"
          commit_message: "Update latest videos"
