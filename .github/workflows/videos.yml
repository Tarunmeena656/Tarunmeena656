# Rewrites the "Latest videos" list in README.md from the channel's RSS feed.
name: Latest videos

on:
  schedule:
    - cron: "30 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/videos.yml"]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gautamkrishnar/blog-post-workflow@v1
        with:
          feed_list: "https://www.youtube.com/feeds/videos.xml?channel_id=UCE7f-OWz1zyPJ3_PjPhHKqg"
          max_post_count: 3
          comment_tag_name: "YOUTUBE-LIST"
          commit_message: "Update latest videos"
